services:
  finance:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env          # FINANCE_PASSWORD and SECRET_KEY (never committed)
    volumes:
      - finance-data:/data

volumes:
  finance-data:
    name: multi-agent_finance-data   # fixed name: the data stays when the project folder is renamed
