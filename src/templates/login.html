<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}"><link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml"><title>Login - Finance</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="login"><main>
<span class="brand-mark">€</span>
<h1>Finance</h1>
<p class="login-sub">Enter your password to continue</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Password <input type="password" name="password" autocomplete="current-password" autofocus required></label>
<button type="submit">Log in</button></form></main></body></html>
