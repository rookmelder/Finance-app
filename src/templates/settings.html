{% extends "base.html" %}
{% block title %}Settings - Finance{% endblock %}
{% block content %}
<h1>Settings</h1>

{% if error %}<p class="error">{{ error }}</p>{% endif %}

<section class="card">
  <h2>Global Settings</h2>
  <form method="post" action="{{ url_for('settings') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>Hourly Rate (€):
      <input type="text" name="rate" value="{{ "%.2f"|format(settings.rate_cents / 100) }}" required>
    </label>

    <label>Fietsvergoeding per day (€):
      <input type="text" name="allowance" value="{{ "%.2f"|format(settings.allowance_cents / 100) }}" required>
    </label>

    <label>Hours worked per day:
      <input type="text" name="hours_per_day" value="{{ settings.minutes_per_day | hours }}" required>
    </label>

    <label>Kledijvergoeding per day (€):
      <input type="text" name="clothing" value="{{ "%.2f"|format(settings.clothing_cents / 100) }}">
    </label>

    <label>Sunday premium per Sunday worked (€):
      <input type="text" name="sunday_premium" value="{{ "%.2f"|format(settings.sunday_premium_cents / 100) }}">
    </label>

    <label>Social security / RSZ (% of gross):
      <input type="text" name="rsz" value="{{ settings.rsz_bp | percent }}">
    </label>

    <label>Other monthly benefit (€):
      <input type="text" name="other" value="{{ "%.2f"|format(settings.other_cents / 100) }}">
    </label>

    <fieldset>
      <legend>Budget Split Percentages (must sum to 100)</legend>
      <label>Needs (%):
        <input type="number" name="needs_pct" value="{{ settings.needs_pct }}" min="0" max="100" required>
      </label>

      <label>Free spend (%):
        <input type="number" name="free_pct" value="{{ settings.free_pct }}" min="0" max="100" required>
      </label>

      <label>Savings (%):
        <input type="number" name="save_pct" value="{{ settings.save_pct }}" min="0" max="100" required>
      </label>
    </fieldset>

    <label class="checkbox-label">
      <input type="checkbox" name="carry_over" value="1" {% if settings.carry_over %}checked{% endif %}>
      Carry over leftover free-spend budget to next month
    </label>

    <button type="submit">Save Settings</button>
  </form>
</section>
{% endblock %}
